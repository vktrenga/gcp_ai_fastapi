[project]
name = "GCP-AI-FastAPI"
version = "0.1.0"
description = "Learning GCP AI with FastAPI for Architect"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "psycopg2-binary>=2.9.13",
    "sqlalchemy>=2.0.52",
    "uvicorn",
    "bcrypt>=4.2.0",
    "alembic",
    "pydantic[email]>=2.13.3",
    "PyJWT"
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]
